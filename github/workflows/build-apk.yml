name: Build Auto Clicker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          if [ ! -f AutoClicker-Android-Source.zip ]; then
            echo "Source ZIP not found in repository"
            exit 1
          fi

      - name: Extract project
        run: unzip -o AutoClicker-Android-Source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: AutoClickerProject
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-APK
          path: AutoClickerProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
